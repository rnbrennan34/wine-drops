<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wine Drops</title>
<meta name="description" content="Wine prices tracked daily across independent US shops. Shows which discounts are real.">
<style>
:root{--bg:#faf8f5;--card:#fff;--ink:#1d1a17;--mute:#6f675f;--line:#e6e0d8;--wine:#7a1f3d;--good:#1f6b45;--goodbg:#e4f2ea;--warn:#8a5a00;--warnbg:#fbf0d6;--bad:#9b2c2c;--badbg:#fae5e3;--chip:#f1ece5}
@media (prefers-color-scheme:dark){:root{--bg:#151312;--card:#1e1b19;--ink:#f1ece6;--mute:#a59c92;--line:#322d29;--wine:#e08aa5;--good:#7fd1a4;--goodbg:#173326;--warn:#e7c06a;--warnbg:#3a2f14;--bad:#f09a94;--badbg:#3d1d1b;--chip:#2a2623}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:980px;margin:0 auto;padding:20px 16px 60px}
h1{font:600 28px/1.1 Georgia,"Times New Roman",serif;margin:0;color:var(--wine)}
.sub{color:var(--mute);margin:6px 0 18px;font-size:14px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tab{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 12px;border-radius:999px;font:inherit;font-size:14px;cursor:pointer}
.tab b{font-weight:600;color:var(--mute);margin-left:4px}
.tab[aria-selected=true]{background:var(--wine);border-color:var(--wine);color:var(--bg)}
.tab[aria-selected=true] b{color:inherit;opacity:.8}
.ctl{display:grid;grid-template-columns:1fr 92px 92px 150px 170px;gap:8px;margin-bottom:14px}
@media (max-width:720px){.ctl{grid-template-columns:1fr 1fr}.ctl input[type=search]{grid-column:1/-1}}
input,select{font:inherit;font-size:14px;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);width:100%;min-width:0}
.note{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;color:var(--mute);font-size:14px;margin-bottom:12px}
.note strong{color:var(--ink)}
.row{display:grid;grid-template-columns:52px 1fr auto 32px;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.row img,.ph{width:52px;height:64px;object-fit:contain;border-radius:6px;background:var(--chip)}
.t{font-weight:600;color:var(--ink);text-decoration:none;overflow-wrap:anywhere}
.t:hover{text-decoration:underline}
.m{color:var(--mute);font-size:13px;margin-top:2px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{font-size:12.5px;padding:3px 8px;border-radius:6px;background:var(--chip);color:var(--mute)}
.chip.good{background:var(--goodbg);color:var(--good)}
.chip.warn{background:var(--warnbg);color:var(--warn)}
.chip.bad{background:var(--badbg);color:var(--bad)}
.p{text-align:right;white-space:nowrap}
.p .now{font:600 18px/1.1 Georgia,serif}
.p .was{color:var(--mute);font-size:12.5px;text-decoration:line-through}
.star{border:0;background:none;font-size:20px;cursor:pointer;color:var(--line);padding:4px;line-height:1}
.star.on{color:#d4a017}
.more{display:block;margin:14px auto 0;padding:10px 18px}
footer{color:var(--mute);font-size:12.5px;margin-top:28px;border-top:1px solid var(--line);padding-top:12px}
</style>
</head>
<body>
<div class="wrap">
  <h1>Wine Drops</h1>
  <div class="sub" id="sub">Loading prices…</div>
  <div class="tabs" id="tabs" role="tablist"></div>
  <div class="ctl">
    <input type="search" id="q" placeholder="Search producer, wine, vintage" aria-label="Search">
    <input type="number" id="min" placeholder="Min $" min="0" aria-label="Minimum price">
    <input type="number" id="max" placeholder="Max $" min="0" aria-label="Maximum price">
    <select id="store" aria-label="Store"><option value="">All stores</option></select>
    <select id="sort" aria-label="Sort"></select>
  </div>
  <div id="note"></div>
  <div id="list"></div>
  <button class="tab more" id="more" hidden>Show more</button>
  <footer id="foot"></footer>
</div>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const usd = (n) => "$" + (n % 1 ? n.toFixed(2) : n.toLocaleString());
const fmtDay = (d) => new Date(d + "T12:00:00").toLocaleDateString("en-US", { month: "short", day: "numeric" });
let D, tab = "real", shown = 60;
let watch = {};
try { watch = JSON.parse(localStorage.getItem("wd_watch") || "{}"); } catch {}
const saveWatch = () => { try { localStorage.setItem("wd_watch", JSON.stringify(watch)); } catch {} };

const TABS = {
  real: { label: "Real discounts", f: (i) => i.real >= 3, sort: "real" },
  claims: { label: "Store sales, checked", f: (i) => i.claim, sort: "claim" },
  all: { label: "All bottles", f: () => true, sort: "price_asc" },
  watch: { label: "My watchlist", f: (i) => watch[i.id], sort: "since" },
};
const SORTS = {
  real: ["Biggest real discount", (a, b) => (b.real || 0) - (a.real || 0)],
  claim: ["Biggest claimed discount", (a, b) => (b.claim || 0) - (a.claim || 0)],
  price_asc: ["Price, low to high", (a, b) => a.price - b.price],
  price_desc: ["Price, high to low", (a, b) => b.price - a.price],
  newest: ["Newest listings", (a, b) => (b.first > a.first ? 1 : b.first < a.first ? -1 : 0)],
  since: ["Change since I starred", (a, b) => sinceStar(a) - sinceStar(b)],
};
const sinceStar = (i) => (watch[i.id] ? (i.price - watch[i.id].price) / watch[i.id].price : 0);

function verdict(i) {
  // Does the store's "was" price hold up against what other shops charge today?
  if (!i.claim || !i.cross) return null;
  const ref = i.cross.ref;
  if (i.price > ref * 1.02) return ["bad", `Not a deal: ${usd(ref)} elsewhere`];
  if (i.cmp > ref * 1.15) return ["warn", `"Was ${usd(i.cmp)}" is inflated: ${usd(ref)} elsewhere`];
  return ["good", `Claim holds: ${usd(ref)} elsewhere`];
}

function chips(i) {
  const c = [];
  if (i.drop && Math.abs(i.drop.pct) >= 1) {
    c.push(i.drop.pct > 0
      ? ["good", `Down ${i.drop.pct}% from ${usd(i.drop.was)} on ${fmtDay(i.drop.since)}`]
      : ["bad", `Up ${-i.drop.pct}% from ${usd(i.drop.was)} on ${fmtDay(i.drop.since)}`]);
  }
  if (i.cross) {
    const names = i.cross.others.map(([s, p]) => `${D.stores[s]?.name || s} ${usd(p)}`).join(", ");
    if (i.cross.pct >= 3) c.push(["good", `${i.cross.pct}% under ${names}`]);
    else if (i.cross.pct <= -3) c.push(["bad", `Cheaper at ${names}`]);
    else c.push(["", `Same price at ${names}`]);
  }
  const v = verdict(i);
  if (v) c.push(v);
  else if (i.claim) c.push(["", `Store says ${i.claim}% off ${usd(i.cmp)} (unchecked)`]);
  if (watch[i.id]) {
    const s = sinceStar(i);
    if (Math.abs(s) >= 0.005) c.push([s < 0 ? "good" : "bad", `${s < 0 ? "Down" : "Up"} ${Math.abs(s * 100).toFixed(1)}% since you starred it at ${usd(watch[i.id].price)}`]);
  }
  if (i.size !== 750) c.push(["", i.size >= 1000 ? i.size / 1000 + "L" : i.size + "ml"]);
  return c.map(([k, t]) => `<span class="chip ${k}">${esc(t)}</span>`).join("");
}

function row(i) {
  const img = i.img ? `<img loading="lazy" alt="" src="${esc(i.img)}${i.img.includes("?") ? "&" : "?"}width=120">` : `<div class="ph"></div>`;
  return `<div class="row">${img}
    <div><a class="t" href="${esc(i.url)}" target="_blank" rel="noopener">${esc(i.title)}</a>
      <div class="m">${esc(D.stores[i.store]?.name || i.store)}</div>
      <div class="chips">${chips(i)}</div></div>
    <div class="p"><div class="now">${usd(i.price)}</div>${i.drop?.pct > 0 ? `<div class="was">${usd(i.drop.was)}</div>` : ""}</div>
    <button class="star ${watch[i.id] ? "on" : ""}" data-id="${esc(i.id)}" title="Watch this bottle" aria-label="Watch this bottle">★</button></div>`;
}

function current() {
  const q = $("q").value.trim().toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").split(/\s+/).filter(Boolean);
  const min = +$("min").value || 0, max = +$("max").value || Infinity, st = $("store").value;
  return D.items.filter((i) => TABS[tab].f(i) && i.price >= min && i.price <= max && (!st || i.store === st) && q.every((w) => i._s.includes(w)))
    .sort(SORTS[$("sort").value][1]);
}

function render() {
  for (const b of $("tabs").children) {
    b.setAttribute("aria-selected", b.dataset.t === tab);
    b.querySelector("b").textContent = D.items.filter(TABS[b.dataset.t].f).length.toLocaleString();
  }
  const rows = current();
  const days = D.tracked_days;
  let note = "";
  if (tab === "real") note = `<strong>A real discount</strong> means one of two things: the price fell at the same shop since we started tracking it, or the same bottle and vintage costs more at another shop today. Tracking started ${fmtDay(D.first_day)}${days < 14 ? `, so price-drop history is still thin (${days} day${days === 1 ? "" : "s"}). Most of what you see here is the cross-shop comparison` : ""}.`;
  if (tab === "claims") note = `Every bottle a shop marks as on sale. Where another shop stocks the same bottle, the claim is checked against that price. Unchecked claims are the shop's word only.`;
  if (tab === "watch") note = rows.length || Object.keys(watch).length ? `Starred bottles are saved in this browser. Each shows how its price has moved since you starred it.` : `Star a bottle to follow its price. The list is saved in this browser, no account needed.`;
  $("note").innerHTML = note ? `<div class="note">${note}</div>` : "";
  $("list").innerHTML = rows.slice(0, shown).map(row).join("") || `<div class="note">Nothing matches.</div>`;
  $("more").hidden = rows.length <= shown;
  $("more").textContent = `Show more (${(rows.length - shown).toLocaleString()} left)`;
}

function setTab(t) { tab = t; shown = 60; $("sort").value = TABS[t].sort; render(); }

fetch("data.json").then((r) => r.json()).then((d) => {
  D = d;
  for (const i of D.items) i._s = (i.title + " " + (D.stores[i.store]?.name || "")).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
  const nStores = Object.keys(D.stores).length;
  $("sub").textContent = `${D.counts.items.toLocaleString()} bottles in stock at ${nStores} shops, priced ${fmtDay(D.today)}. We keep our own price history, so a discount has to be real to show up.`;
  $("tabs").innerHTML = Object.entries(TABS).map(([k, v]) => `<button class="tab" role="tab" data-t="${k}">${v.label}<b></b></button>`).join("");
  $("store").innerHTML += Object.entries(D.stores).sort((a, b) => a[1].name.localeCompare(b[1].name)).map(([k, v]) => `<option value="${k}">${esc(v.name)} (${v.items})</option>`).join("");
  $("sort").innerHTML = Object.entries(SORTS).map(([k, v]) => `<option value="${k}">${v[0]}</option>`).join("");
  $("foot").textContent = `Prices come from each shop's public catalog and are checked once a day. Shipping and tax are not included. Matching across shops requires the same producer, wine, vintage and bottle size.`;
  $("tabs").onclick = (e) => { const b = e.target.closest(".tab"); if (b) setTab(b.dataset.t); };
  for (const id of ["q", "min", "max", "store", "sort"]) $(id).oninput = () => { shown = 60; render(); };
  $("more").onclick = () => { shown += 120; render(); };
  $("list").onclick = (e) => {
    const b = e.target.closest(".star"); if (!b) return;
    const it = D.items.find((i) => i.id === b.dataset.id);
    if (watch[it.id]) delete watch[it.id]; else watch[it.id] = { price: it.price, at: D.today };
    saveWatch(); render();
  };
  setTab("real");
}).catch(() => { $("sub").textContent = "Could not load prices."; });
</script>
</body>
</html>
