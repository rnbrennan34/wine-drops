name: daily-prices
on:
  schedule:
    - cron: "17 13 * * *" # 05:17 Pacific (06:17 in summer)
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency: { group: daily-prices, cancel-in-progress: false }
jobs:
  run:
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.deploy.outputs.page_url }}" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/scrape.mjs
      - run: node scripts/build.mjs
      - name: Commit price history
        run: |
          git config user.name "wine-drops-bot"
          git config user.email "wine-drops-bot@users.noreply.github.com"
          git add data/history.json site/data.json
          git diff --cached --quiet || git commit -m "prices $(TZ=America/Los_Angeles date +%F)"
          git push
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
      - id: deploy
        uses: actions/deploy-pages@v4
